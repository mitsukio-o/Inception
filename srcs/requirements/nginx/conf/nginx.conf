# nginx refuses to start without an events block. The default
# worker_connections of 768 is ample for this stack.
events {}

http {
    include /etc/nginx/mime.types;

    server {
        # The port inside the container. It must match the right-hand side of
        # the nginx `ports:` entry in srcs/docker-compose.yml and EXPOSE in this
        # service's Dockerfile. Nothing listens on 80 anywhere in this file,
        # which is why plain HTTP is refused rather than redirected.
        listen 443 ssl;
        server_name kmitsuki.42.fr;

        # Generated at build time by the Dockerfile; the certificate CN matches
        # server_name above.
        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root  /var/www/html;
        index index.php index.html;

        # Serve a real file when one exists -- which is how CSS, JavaScript and
        # images are returned without ever reaching PHP -- and otherwise hand
        # the request to index.php, which is what makes permalinks work. With a
        # =404 fallback every URL but the home page would return 404.
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            # Debian's own snippet. It ends by including fastcgi.conf, which
            # sets SCRIPT_FILENAME -- the parameter php-fpm needs in order to
            # know which file to execute.
            include snippets/fastcgi-php.conf;
            # Must match `listen` in wordpress/conf/www.conf.
            fastcgi_pass wordpress:9000;
        }
    }
}
